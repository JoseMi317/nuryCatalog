<section class="space-y-5">
  <div>
    <p class="text-sm font-semibold uppercase tracking-wide text-primary">Formulario visual</p>
    <h2 class="text-2xl font-bold">Nueva propiedad</h2>
    <p class="mt-1 text-sm text-base-content/60">Mock de captura para definir cómo se verá el CRUD antes de conectar datos reales.</p>
  </div>

  <form class="grid gap-5 lg:grid-cols-[1fr_320px]">
    <div class="space-y-5">
      <div class="rounded-box border border-base-300 bg-base-100 p-5">
        <h3 class="mb-4 text-lg font-semibold">Información principal</h3>
        <div class="grid gap-4 md:grid-cols-2">
          <label class="form-control md:col-span-2">
            <span class="label-text">Título de la propiedad</span>
            <input class="input input-bordered" type="text" placeholder="Apartamento moderno en Zona 14" />
          </label>
          <label class="form-control">
            <span class="label-text">Tipo</span>
            <select class="select select-bordered">
              <option>Apartamento</option>
              <option>Casa</option>
              <option>Terreno</option>
              <option>Local</option>
            </select>
          </label>
          <label class="form-control">
            <span class="label-text">Operación</span>
            <select class="select select-bordered">
              <option>Venta</option>
              <option>Renta</option>
            </select>
          </label>
          <label class="form-control">
            <span class="label-text">Precio</span>
            <input class="input input-bordered" type="text" placeholder="$185,000" />
          </label>
          <label class="form-control">
            <span class="label-text">Ubicación general</span>
            <input class="input input-bordered" type="text" placeholder="Zona 15, Guatemala" />
          </label>
          <label class="form-control md:col-span-2">
            <span class="label-text">Descripción</span>
            <textarea class="textarea textarea-bordered min-h-32" placeholder="Describe los puntos más atractivos de la propiedad"></textarea>
          </label>
        </div>
      </div>

      <div class="rounded-box border border-base-300 bg-base-100 p-5">
        <h3 class="mb-4 text-lg font-semibold">Características</h3>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <label class="form-control">
            <span class="label-text">Metraje</span>
            <input class="input input-bordered" type="number" placeholder="118" />
          </label>
          <label class="form-control">
            <span class="label-text">Habitaciones</span>
            <input class="input input-bordered" type="number" placeholder="3" />
          </label>
          <label class="form-control">
            <span class="label-text">Baños</span>
            <input class="input input-bordered" type="number" placeholder="2" />
          </label>
          <label class="form-control">
            <span class="label-text">Parqueos</span>
            <input class="input input-bordered" type="number" placeholder="2" />
          </label>
        </div>
      </div>
    </div>

    <aside class="space-y-5">
      <div class="rounded-box border border-base-300 bg-base-100 p-5">
        <h3 class="mb-4 text-lg font-semibold">Publicación</h3>
        <label class="form-control">
          <span class="label-text">Estado</span>
          <select class="select select-bordered">
            <option>Disponible</option>
            <option>Reservado</option>
            <option>Vendido</option>
            <option>Inactivo</option>
          </select>
        </label>
        <label class="form-control mt-4">
          <span class="label-text">WhatsApp de contacto</span>
          <input class="input input-bordered" type="text" placeholder="+502 0000 0000" />
        </label>
      </div>

      <div class="rounded-box border border-base-300 bg-base-100 p-5">
        <h3 class="mb-4 text-lg font-semibold">Fotos</h3>
        <input class="file-input file-input-bordered w-full" type="file" />
        <div class="mt-4 rounded-lg border border-dashed border-base-300 p-4 text-center text-sm text-base-content/60">
          Vista previa de imágenes pendiente
        </div>
      </div>

      <div class="flex gap-3">
        <button class="btn btn-primary flex-1" type="button">Guardar</button>
        <button class="btn btn-ghost" type="button">Cancelar</button>
      </div>
    </aside>
  </form>
</section>
