<section class="space-y-4">
  <div class="gallery-main aspect-[16/10]">
    <img class="h-full w-full object-cover" [src]="images()[selectedIndex()]" [alt]="title()" />
  </div>

  <div class="grid grid-cols-3 gap-3 sm:grid-cols-4">
    @for (image of images(); track image; let index = $index) {
      <button
        type="button"
        class="gallery-thumb aspect-[4/3]"
        [class.gallery-thumb-active]="selectedIndex() === index"
        (click)="selectedIndex.set(index)"
        [attr.aria-label]="'Ver imagen ' + (index + 1)"
      >
        <img
          class="h-full w-full object-cover"
          [src]="image"
          [alt]="title() + ' imagen ' + (index + 1)"
        />
      </button>
    }
  </div>
</section>
