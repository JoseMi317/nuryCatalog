<section class="space-y-3">
  <div class="aspect-[16/10] overflow-hidden rounded-box bg-base-200">
    <img
      class="h-full w-full object-cover"
      [src]="images()[selectedIndex()]"
      [alt]="title()"
    />
  </div>

  <div class="grid grid-cols-3 gap-3 sm:grid-cols-4">
    @for (image of images(); track image; let index = $index) {
      <button
        type="button"
        class="aspect-[4/3] overflow-hidden rounded-lg border bg-base-200 transition"
        [class.border-primary]="selectedIndex() === index"
        [class.border-base-300]="selectedIndex() !== index"
        (click)="selectedIndex.set(index)"
        [attr.aria-label]="'Ver imagen ' + (index + 1)"
      >
        <img class="h-full w-full object-cover" [src]="image" [alt]="title() + ' imagen ' + (index + 1)" />
      </button>
    }
  </div>
</section>
