<a
  class="property-card-link"
  [routerLink]="['/propiedades', property().slug]"
  [attr.aria-label]="'Ver propiedad ' + property().title"
>
  <article class="property-card">
    <figure class="property-card__media">
      <img class="property-card__image" [src]="property().images[0]" [alt]="property().title" />
      <div class="property-card__shade"></div>

      <div class="property-card__badges">
        <span class="property-badge">{{ property().categoryLabel }}</span>
        <span class="property-badge property-badge--status">{{ property().status }}</span>
      </div>

      <span class="property-card__photos"> Fotos </span>
    </figure>

    <div class="property-card__body">
      <div>
        <p class="property-card__meta">{{ property().operation }} · {{ property().location }}</p>
        <h2 class="property-card__title">{{ property().title }}</h2>
      </div>

      <p class="property-card__teaser">
        {{ property().teaser }}
      </p>
    </div>

    <div class="property-card__footer">
      <div>
        <p class="property-card__footer-label">Información</p>
        <p class="property-card__footer-value">Bajo consulta</p>
      </div>
      <span class="property-card__action"> Solicitar </span>
    </div>
  </article>
</a>
