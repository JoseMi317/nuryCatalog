<a
  class="group card h-full overflow-hidden border border-base-300 bg-base-100 text-base-content no-underline shadow-sm transition hover:-translate-y-1 hover:shadow-md"
  [routerLink]="['/propiedades', property().slug]"
  [attr.aria-label]="'Ver propiedad ' + property().title"
>
  <figure class="relative aspect-[4/3] bg-base-200">
    <img
      class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
      [src]="property().images[0]"
      [alt]="property().title"
    />
    <div class="absolute inset-x-0 top-0 flex items-start justify-between gap-2 p-3">
      <span class="badge badge-primary shadow-sm">{{ property().categoryLabel }}</span>
      <span class="badge bg-base-100/90 shadow-sm" [class.badge-success]="property().status === 'Disponible'">
        {{ property().status }}
      </span>
    </div>
  </figure>

  <div class="card-body gap-4 p-5">
    <div class="space-y-2">
      <h2 class="card-title text-lg leading-tight">{{ property().title }}</h2>
      <p class="text-sm text-base-content/65">{{ property().location }}</p>
      <p class="text-sm leading-6 text-base-content/70">{{ property().teaser }}</p>
    </div>

    <div class="flex items-center justify-between gap-3 border-t border-base-200 pt-4">
      <span class="text-xs font-semibold uppercase tracking-wide text-base-content/45">
        Detalles por consulta
      </span>
      <span class="btn btn-primary btn-sm pointer-events-none">Ver fotos</span>
    </div>
  </div>
</a>
